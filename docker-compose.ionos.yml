# IONOS VPS production stack (Postgres + Next.js). Uploads on named volume.
name: mjcarros

services:
  db:
    image: postgres:16-alpine
    container_name: mjcarros-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mjcarros}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mjcarros}"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - mjcarros

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: mjcarros-ecommerce-nextjs:ionos
    container_name: mjcarros-nextjs
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${IONOS_HTTP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      DOCKER: "true"
      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mjcarros}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mjcarros
    volumes:
      - uploads_data:/app/public/uploads
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npm run setup-admin &&
        npm run start
      "

networks:
  mjcarros:
    driver: bridge

volumes:
  pgdata:
    name: mjcarros_pgdata
  uploads_data:
    name: mjcarros_uploads_data
