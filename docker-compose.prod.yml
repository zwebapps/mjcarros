name: mjcarros

services:
  # Legacy MongoDB: kept only as the migration source and rollback copy after the move
  # to Postgres. Bound to localhost so it is no longer reachable from the internet.
  # Remove this service (and the volume) once the Postgres data has been verified.
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  nextjs:
    container_name: nextjs
    restart: unless-stopped
    image: mjcarros-nextjs:prod

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    ports:
      - "8080:3000"

    environment:
      NODE_ENV: production
      DOCKER: "true"

      # Postgres runs on the separate database VPS; set in .env as
      # postgresql://commerce_user:<password>@<db-vps-ip>:5432/commerce_db?schema=public
      POSTGRES_PRISMA_URL: ${POSTGRES_PRISMA_URL:?POSTGRES_PRISMA_URL must be set in .env}

      # Only used by scripts/migrate-mongo-to-postgres.ts during the one-time copy.
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=${MONGO_AUTH_SOURCE}
      MONGO_DATABASE: ${MONGO_DATABASE}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}

      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: http://localhost:8080

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_ENV: ${PAYPAL_ENV}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

    volumes:
      - ./public/uploads:/app/public/uploads:rw

    command: >
      sh -c "
        echo '📦 Applying database migrations...' &&
        npx prisma migrate deploy &&
        echo '👤 Seeding admin + defaults...' &&
        npm run setup-admin &&
        echo '🚀 Starting Next.js...' &&
        npm run start
      "

volumes:
  mongodb_data:
    name: mjcarros_mongodb_data
