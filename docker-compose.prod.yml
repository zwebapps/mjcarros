name: mjcarros

services:
  db:
    image: postgres:16-alpine
    container_name: mjcarros-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mjcarros}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mjcarros}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nextjs:
    container_name: nextjs
    restart: unless-stopped
    image: mjcarros-nextjs:prod

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    ports:
      - "8080:3000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production
      DOCKER: "true"

      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mjcarros}?schema=public

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}

      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: http://localhost:8080

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_ENV: ${PAYPAL_ENV}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

    volumes:
      - ./public/uploads:/app/public/uploads:rw

    command: >
      sh -c "
        echo '⏳ Waiting for Postgres...' &&
        sleep 3 &&
        echo '📦 Applying database schema...' &&
        (npx prisma migrate deploy || npx prisma db push --accept-data-loss) &&
        echo '👤 Seeding admin + defaults...' &&
        npm run setup-admin &&
        echo '🚀 Starting Next.js...' &&
        npm run start
      "

volumes:
  pgdata:
    name: mjcarros_pgdata
