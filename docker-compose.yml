# Local dev: PostgreSQL + Next.js (hot reload via `npm run dev` on host, or build nextjs service).
name: mjcarros

services:
  db:
    image: postgres:16-alpine
    container_name: mjcarros-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mjcarros}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mjcarros}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mjcarros_dev

  nextjs:
    container_name: nextjs
    image: mjcarros-ecommerce-nextjs:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DOCKER: "true"
      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mjcarros}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mjcarros_dev
    volumes:
      - ./public/uploads:/app/public/uploads:rw

networks:
  mjcarros_dev:
    driver: bridge

volumes:
  pgdata_dev:
    name: mjcarros_pgdata_dev
